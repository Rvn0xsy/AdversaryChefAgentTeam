services:
  nexus-mcp:
    build:
      context: ..
      dockerfile: docker/nexus-mcp/Dockerfile
    ports:
      - "8081:8081"
    command: ["-db", "/data/nexus.db"]
    volumes:
      - nexus-data:/data

  kali-mcp:
    build:
      context: ..
      dockerfile: docker/kali-mcp/Dockerfile
    ports:
      - "8080:8080"
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  mythic-mcp:
    build:
      context: ..
      dockerfile: docker/mythic-mcp/Dockerfile
    ports:
      - "8082:8082"
    command:
      - "--mythic-server=${MYTHIC_SERVER:-}"
      - "--mythic-api-key=${MYTHIC_API_KEY:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # goose worker image — acasched spins up ephemeral containers via `docker run`
  goose:
    build:
      context: ..
      dockerfile: docker/goose/Dockerfile
    image: goose:latest
    environment:
      - GOOSE_DISABLE_KEYRING=1
    entrypoint: ["goose"]
    profiles:
      - build-only

volumes:
  nexus-data:
