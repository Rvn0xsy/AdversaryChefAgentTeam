services:
  nexus-mcp:
    build:
      context: ..
      dockerfile: docker/nexus-mcp/Dockerfile
    ports:
      - "8081:8081"
    command: ["-db", "/data/nexus.db"]
    volumes:
      - nexus-data:/data

  kali-mcp:
    build:
      context: ..
      dockerfile: docker/kali-mcp/Dockerfile
    ports:
      - "8080:8080"
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  mythic-mcp:
    build:
      context: ..
      dockerfile: docker/mythic-mcp/Dockerfile
    ports:
      - "8082:8082"
    command:
      - "--mythic-server=${MYTHIC_SERVER:-}"
      - "--mythic-api-key=${MYTHIC_API_KEY:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  acasched:
    build:
      context: ..
      dockerfile: docker/acasched/Dockerfile
    ports:
      - "9090:9090"
    command:
      - "-db"
      - "/data/acasched.db"
      - "-nexus-mcp"
      - "http://nexus-mcp:8081"
      - "-kali-mcp"
      - "http://kali-mcp:8080"
      - "-mythic-mcp"
      - "http://mythic-mcp:8082"
      - "-prompts"
      - "/prompts"
    volumes:
      - acasched-data:/data
      - ./prompts:/prompts:ro
    depends_on:
      - nexus-mcp
      - kali-mcp
      - mythic-mcp

volumes:
  nexus-data:
  acasched-data:
