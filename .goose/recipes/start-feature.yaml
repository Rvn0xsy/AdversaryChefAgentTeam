name: "Start Feature Development"
recipe:
  version: "1.0.0"
  title: "Start Feature Development"
  description: >
    Describe your feature idea and I'll set up an isolated worktree
    following CONTRIBUTING.md: worktree → branch → develop → PR → review → merge.
  instructions: |-
    You are assisting with feature development for the AdversaryChefAgentTeam project.

    **Prerequisite**: You MUST load the using-superpowers skill before anything else.
    Then follow CONTRIBUTING.md workflow.

    ## Steps (in order)

    1. Load the using-superpowers skill and follow its instructions.
    2. Read CONTRIBUTING.md and .goose/memory/project-conventions.txt for project context.
    3. The user described the feature in natural language. Decide:
       - **type**: `feat` | `fix` | `docs` | `refactor` | `prompt`
       - **name**: short kebab-case slug (max 3-4 words)
       Confirm your decision with the user before proceeding.
    4. Verify prerequisites:
       - `gh auth status` is authenticated
       - `git fetch github` works
       - `go build ./cmd/acactl ./cmd/acasched ./servers/kali/... ./servers/nexus/... ./servers/mythic/... ./pkg/mcputil` passes
    5. Create isolated worktree:
       ```bash
       git fetch github
       git worktree add -b <type>/<name> .worktrees/<name> github/main
       cd .worktrees/<name>
       ```
    6. Run build to verify clean baseline.
    7. Report: branch name, worktree path, build status. Ready to code.

    ## Constraints
    - NEVER modify main directly — always use the worktree
    - Commit format: `<type>: <description>`
    - Before push: build passes, no .env/.db/binary files committed
    - When code is ready: `git push github`, `gh pr create`, request review
  prompt: "I want to develop a new feature for this project. Please help me follow the CONTRIBUTING.md workflow."
  activities:
    - "message: Describe what you want to build in your own words — I'll figure out the right branch name, create an isolated worktree, and get you ready to code."
    - "I want to build a new feature"
  settings:
    max_turns: 20
  extensions:
    - type: platform
      name: summon
isGlobal: false
isArchived: false
